<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#ff6600">
  <meta name="description" content="A multi-sector pay calculator for flights from and back to London Gatwick.">
  <title>Sector Pay</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%23172033'/%3E%3Cpath fill='white' d='M51 30.5 36 24V13c0-3-1.8-6-4-6s-4 3-4 6v11l-15 6.5v4L28 31v12l-6 4v3l10-2 10 2v-3l-6-4V31l15 3.5z'/%3E%3C/svg%3E">
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;color:#172033;background:#f2f4f7;font-synthesis:none}
    *{box-sizing:border-box}
    body{margin:0;min-width:320px;background:#f2f4f7}
    button,input,select{font:inherit}
    button{-webkit-appearance:none;appearance:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
    .app{max-width:720px;margin:0 auto;padding:max(20px,env(safe-area-inset-top)) 14px calc(32px + env(safe-area-inset-bottom))}
    header{padding:4px 4px 12px}
    h1{font-size:clamp(1.75rem,7vw,2.15rem);line-height:1.05;letter-spacing:-.04em;margin:0 0 7px}
    .intro,.muted{color:#667085}.intro{font-size:.92rem;margin:0}
    .card{background:#fff;border:1px solid rgba(16,24,40,.05);border-radius:19px;padding:16px;margin:10px 0;box-shadow:0 3px 16px rgba(16,24,40,.07)}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    label{font-size:.75rem;font-weight:760;letter-spacing:.035em;color:#667085;display:block;margin:0 0 6px}
    input,select{width:100%;height:48px;border:1px solid #d0d5dd;border-radius:12px;background:#fff;padding:0 13px;font-size:1.0625rem;outline:none;text-transform:uppercase;color:#172033}
    select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,#667085 50%),linear-gradient(135deg,#667085 50%,transparent 50%);background-position:calc(100% - 18px) 20px,calc(100% - 13px) 20px;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:34px}
    input:focus,select:focus{border-color:#667085;box-shadow:0 0 0 3px rgba(102,112,133,.12)}
    input:disabled{background:#f8fafc;color:#667085;-webkit-text-fill-color:#667085;opacity:1}
    .sectorHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
    .sectorNo{font-size:1.08rem;font-weight:820}
    .remove{min-height:40px;border:0;background:#f2f4f7;color:#475467;border-radius:10px;padding:8px 12px;font-size:.875rem;font-weight:760}
    .remove:active{background:#e4e7ec}
    .result{margin-top:12px;min-height:61px;border-radius:13px;background:#f8fafc;padding:11px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
    .route{font-size:.96rem;font-weight:800}.detail{font-size:.82rem;color:#667085;margin-top:4px}.pay{font-size:1.25rem;font-weight:850;white-space:nowrap}
    .error{color:#b42318;font-size:.82rem}
    .add{width:100%;min-height:54px;border:0;border-radius:15px;background:#172033;color:#fff;font-size:1.0625rem;font-weight:820;margin:4px 0 10px;box-shadow:0 4px 12px rgba(23,32,51,.16)}
    .add:active{transform:scale(.99);background:#25304a}
    .secondaryAction{width:100%;min-height:48px;border:0;border-radius:13px;background:#e4e7ec;color:#344054;font-size:.95rem;font-weight:760}
    .summary{display:grid;grid-template-columns:1fr 1.25fr;gap:10px}.stat{background:#f8fafc;border-radius:14px;padding:13px}
    .stat span{display:block;color:#667085;font-size:.75rem;font-weight:750}.stat strong{display:block;font-size:1.6rem;letter-spacing:-.035em;margin-top:4px}
    details{margin-top:10px}summary{cursor:pointer;font-weight:800;min-height:42px;display:flex;align-items:center;justify-content:space-between;list-style:none}summary::-webkit-details-marker{display:none}summary:after{content:"＋";color:#667085}
    details[open] summary:after{content:"−"}
    table{width:100%;border-collapse:collapse;font-size:.86rem}th,td{padding:9px 2px;border-top:1px solid #eaecf0;text-align:left}th:last-child,td:last-child{text-align:right}
    .custom{margin-top:12px;padding-top:12px;border-top:1px solid #eaecf0}.custom h2{font-size:1rem;margin:0 0 4px}.custom p{font-size:.82rem;margin:0 0 12px}.saveMsg{font-size:.82rem;margin-top:8px;min-height:18px}
    .empty{font-size:.9rem;color:#667085;text-align:center;padding:18px 8px}
    @media(max-width:430px){.grid{grid-template-columns:1fr}.card{padding:15px}.result{align-items:flex-start}.pay{font-size:1.15rem}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
    :root{--orange:#ff6600;background:#fff4ec;color:#27221f}
    body{background:#fff4ec}
    header{background:var(--orange);color:#fff;padding:24px;border-radius:20px;margin-bottom:16px}
    .brand-logo{display:block;width:160px;max-width:100%;height:auto;filter:brightness(0) invert(1);margin-bottom:20px}
    header .intro{color:#fff;font-weight:600}
    .card{box-shadow:0 3px 16px rgba(110,48,0,.07)}
    input:focus,select:focus{border-color:var(--orange);box-shadow:0 0 0 3px rgba(255,102,0,.18)}
    .add{background:var(--orange);color:#261500;box-shadow:0 4px 12px rgba(255,102,0,.2)}
    .add:active{background:#e65c00}
    .remove,.secondaryAction{background:#fff0e5;color:#913b00}
    .remove:active,.secondaryAction:active{background:#ffe0ca}
    .result,.stat{background:#fff4ec}
    .pay,.stat strong{color:#a33d00}
    .brand-note{color:#795c4c;font-size:.75rem;text-align:center;line-height:1.5;margin:18px 8px 0}
    .brand-note a{color:inherit}
  </style>
</head>

    <h1>Sector Pay</h1>
    <p class="intro">UK-base multi-sector calculator</p>

  <section class="card" aria-label="Calculator settings">
    <div class="grid">

  try{
    var stored=JSON.parse(localStorage.getItem("sectorPayCustomAirports")||"{}");
    Object.keys(stored).forEach(function(code){airports[code]=stored[code];});
  }catch(ignore){}

  var sectorHost=document.getElementById("sectors");
  var rateInput=document.getElementById("rate");
  var baseInput=document.getElementById("base");

  function cleanCode(value){return String(value||"").trim().toUpperCase().replace(/[^A-Z]/g,"").slice(0,3);}
  function distance(a,b){
    var radius=3440.065,rad=Math.PI/180,lat1=a[1]*rad,lat2=b[1]*rad;
    var dLat=(b[1]-a[1])*rad,dLon=(b[2]-a[2])*rad;
    var h=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLon/2)*Math.sin(dLon/2);
    return Math.round(2*radius*Math.atan2(Math.sqrt(h),Math.sqrt(1-h)));
  }
  function bandFor(nm){
    if(nm<=400)return {name:"Short",factor:0.8};
    if(nm<=1000)return {name:"Medium",factor:1.2};
    if(nm<=1500)return {name:"Long",factor:1.5};
    return {name:"Extra long",factor:2.5};
  }
  function roundMoney(value){return Math.round(((Number(value)||0)+Number.EPSILON)*100)/100;}
  function money(value){return "£"+roundMoney(value).toFixed(2);}
  function currentRate(){return Math.max(0,Number(rateInput.value)||0);}

  function renderBands(){
    var r=currentRate(),bands=[["400 NM or less",0.8],["401–1,000 NM",1.2],["1,001–1,500 NM",1.5],["1,501+ NM",2.5]];
    document.getElementById("bandRows").innerHTML=bands.map(function(item){return "<tr><td>"+item[0]+"</td><td>"+item[1]+"×</td><td>"+money(r*item[1])+"</td></tr>";}).join("");
  }

  function cardMarkup(from,to){
    return '<div class="sectorHead"><div class="sectorNo">Sector</div><button class="remove" type="button" aria-label="Remove sector">Remove</button></div>'+
      '<div class="grid"><div><label>FROM</label><input class="from" list="airportList" maxlength="3" inputmode="text" autocapitalize="characters" autocomplete="off" value="'+from+'"></div>'+
      '<div><label>TO</label><input class="to" list="airportList" maxlength="3" inputmode="text" autocapitalize="characters" autocomplete="off" value="'+to+'"></div></div>'+
      '<div class="result"><span class="muted">Enter valid airport codes</span></div>';
  }

  function addSector(from,to,focusNew){
    var card=document.createElement("section");
    card.className="card sector";
    card.innerHTML=cardMarkup(cleanCode(from),cleanCode(to));
    sectorHost.appendChild(card);
    update();
    if(focusNew){
      var target=cleanCode(to)?card.querySelector(".from"):card.querySelector(".to");
      target.focus({preventScroll:true});
      card.scrollIntoView({behavior:"smooth",block:"center"});
    }
  }

  function suggestedNextLeg(){
    var base=cleanCode(baseInput.value)||"LGW";
    var cards=sectorHost.querySelectorAll(".sector");
    if(!cards.length)return [base,""];
    var last=cards[cards.length-1],from=cleanCode(last.querySelector(".from").value),to=cleanCode(last.querySelector(".to").value);
    if(to && to!==base)return [to,base];
    if(to===base)return [base,""];
    return [from||base,""];
  }

  function update(){
    var cards=sectorHost.querySelectorAll(".sector"),total=0,calculated=0;
    for(var i=0;i<cards.length;i++){
      var card=cards[i],fromInput=card.querySelector(".from"),toInput=card.querySelector(".to");
      var from=cleanCode(fromInput.value),to=cleanCode(toInput.value),out=card.querySelector(".result");
      if(fromInput.value!==from)fromInput.value=from;
      if(toInput.value!==to)toInput.value=to;
      card.querySelector(".sectorNo").textContent="Sector "+(i+1);
      if(airports[from]&&airports[to]){
        var nm=distance(airports[from],airports[to]),band=bandFor(nm),pay=currentRate()*band.factor;
        total+=roundMoney(pay);calculated++;
        out.innerHTML='<div><div class="route">'+from+' → '+to+'</div><div class="detail">'+nm.toLocaleString()+" NM · "+band.name+" · "+band.factor+'×</div></div><div class="pay">'+money(pay)+'</div>';
      }else if((from&&!airports[from])||(to&&!airports[to])){
        var missing=!airports[from]?from:to;
        out.innerHTML='<span class="error">'+missing+' is not in the airport database.</span>';
      }else{
        out.innerHTML='<span class="muted">Enter valid airport codes</span>';
      }
    }
    document.getElementById("sectorCount").textContent=String(calculated);
    document.getElementById("totalPay").textContent=money(total);
    renderBands();
  }

  document.addEventListener("input",function(event){
    if(event.target.matches(".from,.to,#rate"))update();
  });

  baseInput.addEventListener("change",function(){
    var first=sectorHost.querySelector(".sector");
    if(first)first.querySelector(".from").value=cleanCode(baseInput.value);
    update();
  });

  document.addEventListener("click",function(event){
    var removeButton=event.target.closest(".remove");
    if(removeButton){removeButton.closest(".sector").remove();update();return;}
    if(event.target.id==="addSector"){
      event.preventDefault();
      var leg=suggestedNextLeg();
      addSector(leg[0],leg[1],true);
      return;
    }
    if(event.target.id==="clearAll"){
      event.preventDefault();
      sectorHost.innerHTML="";
      addSector(cleanCode(baseInput.value)||"LGW","",false);
      return;
    }
    if(event.target.id==="saveAirport"){
      event.preventDefault();
      var code=cleanCode(document.getElementById("newCode").value);
      var name=document.getElementById("newName").value.trim();
      var lat=Number(document.getElementById("newLat").value),lon=Number(document.getElementById("newLon").value);
      var msg=document.getElementById("saveMsg");
      if(!/^[A-Z]{3}$/.test(code)||!name||!isFinite(lat)||!isFinite(lon)||Math.abs(lat)>90||Math.abs(lon)>180){msg.textContent="Please complete all four fields with valid details.";return;}
      airports[code]=[name,lat,lon];
      try{
        var custom=JSON.parse(localStorage.getItem("sectorPayCustomAirports")||"{}");
        custom[code]=airports[code];
        localStorage.setItem("sectorPayCustomAirports",JSON.stringify(custom));
      }catch(ignore){}
      msg.textContent=code+" saved. You can use it in any sector.";
      update();
    }
  });

  document.getElementById("airportList").innerHTML=Object.keys(airports).sort().map(function(code){
    return '<option value="'+code+'">'+airports[code][0]+'</option>';
  }).join("");
  addSector("LGW","",false);
})();
